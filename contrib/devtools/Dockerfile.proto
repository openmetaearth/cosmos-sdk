# Image for `make proto-gen` and the other proto-* targets.
# `ghcr.io/cosmos/proto-builder:0.14.0` is public, but its protoc plugins do not
# match the generated code in this branch. These pins do. `make proto-image`
# rebuilds this tag after a local image prune.
FROM ghcr.io/cosmos/proto-builder:0.14.0

USER protobuild
ENV GOTOOLCHAIN=auto

RUN go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1 \
 && go install github.com/cosmos/gogoproto/protoc-gen-gocosmos@v1.6.0 \
 && go install github.com/cosmos/gogoproto/protoc-gen-gogo@v1.6.0 \
 && go install github.com/cosmos/cosmos-proto/cmd/protoc-gen-go-pulsar@v1.0.0-beta.5
